<!-- Brand board template. Do not hand-edit the page structure: fill brand.json and run
     `python scripts/build.py board brand.json out.html` (add --standalone for a local file).
     The JSON is injected into the <script id="brand"> tag below. -->
<title>__TITLE__</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<style id="dir-tokens"></style>
<style>
:root{color-scheme:light}
*{box-sizing:border-box}
body{background:var(--paper,#EEEEEA);color:var(--ink,#121212);font-family:var(--f-body);font-size:17px;line-height:1.55;padding-inline:clamp(16px,4vw,48px);padding-block:0 72px}
.wrap{max-width:1180px;margin-inline:auto}
p{margin:0}
h1,h2,h3,h4{margin:0;font-family:var(--f-head);font-weight:var(--head-w);font-variation-settings:var(--head-var);letter-spacing:var(--head-tr);text-transform:var(--head-tt);line-height:1.05;text-wrap:balance}
.lbl{font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--graphite)}
svg.mk{display:block;overflow:visible}
.lock{display:inline-flex;align-items:center;gap:var(--wm-gap);line-height:1;color:var(--ink)}
.lock svg.mk{height:var(--wm-mark);width:auto;flex:none}
.wm{font-family:var(--f-wm);font-weight:var(--wm-w);font-variation-settings:var(--wm-var);letter-spacing:var(--wm-tr);text-transform:var(--wm-tt)}

.bar{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;padding-block:24px}
.bar .lock{font-size:24px}
.intro{padding-block:28px 44px;display:grid;grid-template-columns:1.1fr .9fr;gap:40px;align-items:end}
.intro h1{font-size:clamp(38px,5.6vw,72px)}
.intro .sum{display:flex;flex-direction:column;gap:10px;font-size:16px;color:var(--graphite)}
@media (max-width:820px){.intro{grid-template-columns:1fr}}

.part{border-top:1px solid var(--line);padding-block:52px;display:grid;grid-template-columns:190px 1fr;gap:32px}
.part>.lbl{padding-top:8px}
.part .body{display:flex;flex-direction:column;gap:18px;min-width:0}
.part h2{font-size:clamp(28px,3.4vw,42px)}
.part .body>p{max-width:64ch;color:var(--graphite)}
@media (max-width:760px){.part{grid-template-columns:1fr;gap:16px;padding-block:38px}}

.picker{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.pick{all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;gap:12px;padding:20px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius)}
.pick[aria-pressed="true"]{box-shadow:0 0 0 2px var(--ink)}
.pick:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
.pick .aa{font-size:58px;line-height:.95}
.pick .one{font-size:15px;color:var(--graphite)}
.pick .fonts{font-family:var(--f-mono);font-size:12px;display:flex;flex-direction:column;gap:2px}
.rec{align-self:flex-start;font-family:var(--f-mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;background:var(--primary);color:var(--on-primary);padding:3px 7px}

.tiles2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:700px){.tiles2{grid-template-columns:1fr}}
.mtile{border:1px solid var(--line);border-radius:var(--radius);min-height:280px;display:grid;place-items:center;padding:36px}
.mtile svg.mk{width:min(190px,60%);height:auto}
.mtile.light{background:var(--surface);color:var(--ink)}
.mtile.deep{background:var(--deep);color:var(--deep-fg);border-color:var(--deep)}
.lt{border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);display:flex;flex-direction:column;overflow:hidden}
.lt .show{padding:36px 24px;display:flex;flex-direction:column;gap:26px;align-items:flex-start}
.lt .big{font-size:clamp(44px,6vw,72px)}
.lt .small{font-size:20px}
.lt .deeprow{background:var(--deep);padding:22px 24px}
.lt .deeprow .lock{color:var(--deep-fg);font-size:28px}
.cap{border-top:1px solid var(--line);padding:12px 16px;font-size:14.5px;color:var(--graphite);display:flex;flex-direction:column;gap:4px}
.cap b{font-family:var(--f-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink);font-weight:500}
.rules{margin:0;padding:24px 24px 24px 40px;display:flex;flex-direction:column;gap:10px;font-size:15.5px}
.rules li::marker{color:var(--primary)}

.colors{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.colors>div{border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;background:var(--surface);display:flex;flex-direction:column}
.colors i{display:block;height:96px}
.colors span{padding:10px 12px;font-size:14px;line-height:1.35;display:flex;flex-direction:column;gap:2px;color:var(--graphite)}
.colors b{font-size:15px;color:var(--ink);font-weight:600}
.colors code{font-family:var(--f-mono);font-size:11px}
.ratio{display:flex;height:26px;border:1px solid var(--line)}
.ratio div{height:100%}
.legend{display:flex;flex-wrap:wrap;gap:4px 16px;font-family:var(--f-mono);font-size:11px;color:var(--graphite)}

.faces{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media (max-width:900px){.faces{grid-template-columns:1fr}}
.face{border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);display:flex;flex-direction:column}
.face .role{display:flex;justify-content:space-between;gap:8px;padding:11px 16px;border-bottom:1px solid var(--line)}
.face .role b{font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:500}
.face .aa{padding:16px 16px 6px;font-size:108px;line-height:1}
.face .fam{padding:0 16px;font-size:21px}
.face .gl{padding:10px 16px 16px;font-size:15px;line-height:1.5;color:var(--graphite);word-break:break-word}
.scale{border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);overflow:hidden}
.scale .row{display:grid;grid-template-columns:150px 1fr;gap:16px;align-items:baseline;padding:14px 18px;border-top:1px solid var(--line)}
.scale .row:first-child{border-top:0}
.scale .row>span:first-child{font-family:var(--f-mono);font-size:11px;color:var(--graphite);letter-spacing:.06em}
@media (max-width:620px){.scale .row{grid-template-columns:1fr;gap:6px}}

.mgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media (max-width:760px){.mgrid{grid-template-columns:1fr}}
.mt{border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);display:flex;flex-direction:column;overflow:hidden}
.mt .art{aspect-ratio:16/9;max-width:100%;color:var(--ink);display:grid;place-items:center;overflow:hidden}
.mt .art>svg{width:100%;height:100%;display:block}
.mt .cap{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:520px){.mt .cap{grid-template-columns:1fr}}
.spin{transform-box:fill-box;transform-origin:center;animation:spin 3.2s cubic-bezier(.7,0,.2,1) infinite}
@keyframes spin{0%,40%{transform:rotate(0deg)}70%,100%{transform:rotate(var(--turn))}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
.readout{font-family:var(--f-readout);font-weight:800;line-height:1;letter-spacing:.02em}

.hero{border:1px solid var(--line);border-radius:var(--radius);background:var(--paper);position:relative;overflow:hidden}
.hero nav{position:relative;z-index:1;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px 22px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.hero nav .lock{font-size:22px}
.hero nav .links{display:flex;gap:20px;font-size:15px;color:var(--graphite);flex-wrap:wrap}
.hero .bgmark{position:absolute;right:-4%;top:60px;width:min(46%,480px);color:var(--line2);pointer-events:none}
.hero .bgmark svg{width:100%;height:auto;display:block}
.hero .hb{position:relative;z-index:1;padding:clamp(32px,7vw,88px) clamp(20px,5vw,56px) clamp(32px,6vw,64px);display:flex;flex-direction:column;gap:22px}
.hero h3{font-size:clamp(38px,5.8vw,74px);max-width:14ch}
.hero h3 span{color:var(--graphite)}
.hero .sub{font-size:19px;line-height:1.55;color:var(--graphite);max-width:52ch}
form{display:flex;gap:8px;flex-wrap:wrap}
input{font:inherit;font-size:16px;padding:12px 16px;border:1px solid var(--line);background:var(--surface);color:var(--ink);flex:1 1 220px;max-width:320px;min-width:0;border-radius:var(--btn-radius)}
input::placeholder{color:var(--graphite)}
.btn{font:inherit;font-size:16px;font-weight:600;padding:12px 20px;border:1px solid var(--primary);background:var(--primary);color:var(--on-primary);cursor:pointer;border-radius:var(--btn-radius);display:inline-flex;align-items:center;gap:10px}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--ink)}
.btn svg.mk{height:16px;width:auto}
.btn:focus-visible,input:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.okay{font-family:var(--f-mono);font-size:12.5px;color:var(--accent)}

.apps2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:860px){.apps2{grid-template-columns:1fr}}
.term{background:var(--deep);color:var(--deep-fg);font-family:var(--f-mono);font-size:12.5px;line-height:1.85;padding:18px 20px;overflow-x:auto;border-radius:var(--radius)}
.term .row{white-space:pre}
.term .muted{color:var(--deep-muted)}
.term .accent{color:var(--deep-accent)}
.term .primary{color:var(--deep-primary);font-weight:600}
.term .th{display:flex;justify-content:space-between;color:var(--deep-muted);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;margin-bottom:10px}
.og{aspect-ratio:1200/630;max-width:100%;background:var(--deep);color:var(--deep-fg);border-radius:var(--radius);padding:clamp(18px,3.4vw,36px);display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden}
.og .lock{color:var(--deep-fg);font-size:clamp(16px,2vw,22px)}
.og h4{font-size:clamp(22px,3.2vw,38px);max-width:13ch;position:relative}
.og .om{position:absolute;right:5%;top:12%;width:34%;color:var(--deep-primary)}
.og .om svg{width:100%;height:auto;display:block}
.og .t{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--deep-muted);position:relative}
.comps{display:flex;flex-wrap:wrap;gap:12px;align-items:center;padding:20px;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface)}
.chip{font-family:var(--f-mono);font-size:12px;padding:6px 10px;display:inline-flex;align-items:center;gap:8px;border-radius:var(--btn-radius)}
.chip::before{content:"";width:7px;height:7px;background:currentColor}
.chip.primary{background:var(--primary-tint);color:var(--primary-text)}
.chip.accent{background:var(--accent-tint);color:var(--accent)}
.chip.muted{background:var(--paper);color:var(--graphite);border:1px solid var(--line)}
.vdiv{width:1px;align-self:stretch;background:var(--line)}
.band{border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);color:var(--ink);overflow:hidden;height:120px}
.band svg{display:block;width:100%;height:100%}
footer{border-top:1px solid var(--line);margin-top:56px;padding-top:22px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center}
footer .lock{font-size:18px}
</style>

<script id="brand" type="application/json">/*BRAND_JSON*/</script>

<div class="wrap" id="app"></div>

<script>
(function(){
const B = JSON.parse(document.getElementById('brand').textContent);
const root = document.documentElement;
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const r = n => Math.round(n*100)/100;
const M = B.mark;                       // {viewBox, svg (inner, uses currentColor), symmetry, center:[x,y]}
const dirs = B.directions;
const DEFAULT_MIX = {paper:64, surface:9, ink:16, graphite:4, primary:6, accent:1};

/* ---- fonts: one Google Fonts request covering every direction ---- */
const fams = new Set();
dirs.forEach(d => ['header','body','mono','readout','wordmark'].forEach(k => d.fonts[k] && d.fonts[k].google && fams.add(d.fonts[k].google)));
if (fams.size){
  const l = document.createElement('link'); l.rel = 'stylesheet';
  l.href = 'https://fonts.googleapis.com/css2?' + [...fams].map(f => 'family=' + f).join('&') + '&display=swap';
  document.head.appendChild(l);
}

/* ---- tokens per direction, light + dark ---- */
const stack = {serif:'Georgia,"Times New Roman",serif', sans:'"Helvetica Neue",Arial,sans-serif', mono:'ui-monospace,SFMono-Regular,Consolas,monospace'};
const fam = f => f ? `"${f.family}",${stack[f.fallback || 'sans']}` : 'inherit';
function vars(d, mode){
  const c = d.colors[mode], L = d.colors.light, D = d.colors.dark, f = d.fonts, wm = B.wordmark;
  const wf = f.wordmark || f[wm.role || 'mono'];
  return `--paper:${c.paper};--surface:${c.surface};--ink:${c.ink};--graphite:${c.graphite};--line:${c.line};--line2:${c.line2 || c.line};
--primary:${c.primary};--on-primary:${c.onPrimary};--primary-text:${c.primaryText || c.primary};--primary-tint:${c.primaryTint};
--accent:${c.accent};--accent-tint:${c.accentTint};
--deep:${L.ink};--deep-fg:${L.paper};--deep-muted:${D.graphite};--deep-primary:${D.primary};--deep-accent:${D.accent};
--f-head:${fam(f.header)};--f-body:${fam(f.body)};--f-mono:${fam(f.mono)};--f-readout:${fam(f.readout || f.mono)};--f-wm:${fam(wf)};
--head-w:${f.header.weight || 700};--head-var:${f.header.variation || 'normal'};--head-tr:${f.header.tracking || '-0.025em'};--head-tt:${f.header.transform || 'none'};
--wm-w:${wm.weight || 700};--wm-var:${wm.variation || 'normal'};--wm-tr:${wm.tracking || '-0.04em'};--wm-tt:${wm.transform || 'none'};
--wm-mark:${wm.markHeight || '0.82em'};--wm-gap:${wm.gap || '0.32em'};
--radius:${d.radius || '0px'};--btn-radius:${d.buttonRadius || d.radius || '0px'};--turn:${M.symmetry > 1 ? 360 / M.symmetry : 180}deg;color-scheme:${mode};`;
}
let css = `:root{${vars(dirs[0],'light')}}\n`;
dirs.forEach(d => {
  css += `:root[data-d="${d.id}"]{${vars(d,'light')}}\n`;
  css += `@media (prefers-color-scheme:dark){:root[data-d="${d.id}"]:not([data-theme="light"]){${vars(d,'dark')}}}\n`;
  css += `:root[data-d="${d.id}"][data-theme="dark"]{${vars(d,'dark')}}\n`;
});
document.getElementById('dir-tokens').textContent = css;

/* ---- mark helpers ---- */
const mk = (cls='') => `<svg class="mk" viewBox="${M.viewBox}" aria-hidden="true"><g class="${cls}">${M.svg}</g></svg>`;
const [vx, vy, vw, vh] = M.viewBox.split(/[\s,]+/).map(Number);
const cx = M.center ? M.center[0] : vx + vw/2, cy = M.center ? M.center[1] : vy + vh/2;
const placed = (x, y, size, rot=0, style='') => `<g transform="translate(${x} ${y}) rotate(${rot}) scale(${r(size/Math.max(vw,vh))}) translate(${-cx} ${-cy})" style="${style}">${M.svg}</g>`;
const svg = (w, h, inner, extra='') => `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="xMidYMid meet" aria-hidden="true" ${extra}>${inner}</svg>`;
const lock = (cls='') => `<span class="lock wm ${cls}">${mk()}${esc(B.name)}</span>`;

/* dot matrix of the mark: filled wherever a grid point falls inside the mark's fill or stroke */
const dotMark = (step, rad, accentFrom) => `<svg viewBox="${r(vx-vw*.06)} ${r(vy-vh*.06)} ${r(vw*1.12)} ${r(vh*1.12)}" aria-hidden="true" data-dots data-step="${step}" data-r="${rad}" ${accentFrom ? `data-acc="${accentFrom}"` : ''}><g data-shape style="visibility:hidden">${M.svg}</g><g data-out></g></svg>`;
function dotify(scope){
  scope.querySelectorAll('svg[data-dots]').forEach(sv => {
    const shapeRoot = sv.querySelector('[data-shape]'), out = sv.querySelector('[data-out]');
    const els = [...shapeRoot.querySelectorAll('path,rect,circle,ellipse,polygon,polyline,line')];
    if (!els.length || !els[0].isPointInFill) return;
    const step = +sv.dataset.step, rad = +sv.dataset.r, b = sv.viewBox.baseVal;
    const acc = sv.dataset.acc ? +sv.dataset.acc : Infinity;
    const tests = els.map(el => { const cs = getComputedStyle(el); return {el, fill: cs.fill !== 'none', stroke: cs.stroke !== 'none'}; });
    let s = '';
    for (let y = b.y + step/2; y < b.y + b.height; y += step) for (let x = b.x + step/2; x < b.x + b.width; x += step){
      const p = new DOMPoint(x, y);
      let hit = false;
      try { hit = tests.some(t => (t.fill && t.el.isPointInFill(p)) || (t.stroke && t.el.isPointInStroke(p))); } catch(_){}
      s += hit ? `<circle cx="${r(x)}" cy="${r(y)}" r="${rad}" style="fill:${x > acc ? 'var(--primary)' : 'currentColor'}"/>`
               : `<circle cx="${r(x)}" cy="${r(y)}" r="${r(rad*.2)}" style="fill:currentColor" opacity=".22"/>`;
    }
    out.innerHTML = s;
  });
}

/* ---- built-in motifs (custom ones come from brand.json as SVG strings) ---- */
const T = M.symmetry > 1 ? 360 / M.symmetry : 0;
const BUILTIN = {
  turn: () => T ? {name:'Turn', svg: svg(640,360, `<g class="spin">${placed(320,180,200)}</g>`), means:`The mark turns ${T}° and lands exactly on itself, because it is symmetric.`, where:'Loading and waiting states: buttons, app start-up.'} : null,
  turnstrip: () => T ? {name:'Turn, step by step', svg: svg(640,360, [0,.25,.5,.75,1].map((k,i) => `<g opacity="${i===4?1:r(.18+i*.14)}">${placed(100+i*110,180,86,T*k)}</g>`).join('') + `<rect x="534" y="252" width="12" height="12" style="fill:var(--primary)"/>`), means:'The same turn in five frames: progress that ends where it started.', where:'Onboarding steps, "how it works" sequences, section dividers.'} : null,
  dotmark: () => ({name:'Dot mark', svg:`<div style="width:40%">${dotMark(Math.max(vw,vh)/22, Math.max(vw,vh)/64, vx+vw*.82)}</div>`, means:'The whole mark as a dot-matrix readout. The primary-colored dots mark the part that matters.', where:'Faint hero backgrounds, share cards, stickers and merch.'}),
  tile: () => { let g=''; for (let j=0;j<3;j++) for (let i=0;i<7;i++){ const hot=(i===4&&j===1); g += placed(80+i*120, 70+j*120, 84, ((i+j)%2)*90, hot ? 'color:var(--primary)' : ''); } return {name:'Tile', svg: svg(880,380,g), means:'The mark repeated, alternately turned. One is in the primary color: the one getting attention.', where:'Footer bands, packaging, slide backgrounds, swag.'}; },
  readout: () => ({name:'Readout', svg:`<div style="display:flex;flex-direction:column;gap:10px;align-items:flex-start;padding:24px">${(B.readouts||['12 OK','01 STOP']).map((t,i)=>`<span class="readout" style="font-size:clamp(30px,5.6vw,60px);color:${i===1?'var(--primary-text)':'var(--ink)'}">${esc(t)}</span>`).join('')}</div>`, means:'Numbers and status in the readout face, like a display on hardware.', where:'Counters, status bars, launch-day numbers.'})
};
function motifs(){
  const list = (B.motifs && B.motifs.include) || ['turn','turnstrip','dotmark','tile','readout'];
  const out = list.map(k => BUILTIN[k] && BUILTIN[k]()).filter(Boolean);
  ((B.motifs && B.motifs.custom) || []).forEach(m => out.push({name:m.name, svg:m.svg, means:m.means, where:m.where}));
  return out;
}

/* ---- sections ---- */
function colorsSection(d){
  const c = d.colors.light, notes = d.colorNotes || {};
  const sw = [['primary','Primary',c.primary],['ink','Ink',c.ink],['paper','Paper',c.paper],['graphite','Graphite',c.graphite],['accent','Accent',c.accent]];
  const mix = d.mix || DEFAULT_MIX;
  return `<div class="colors">${sw.map(([k,n,v]) => `<div><i style="background:${v};box-shadow:inset 0 -1px 0 rgba(0,0,0,.08)"></i><span><b>${esc((notes[k]&&notes[k].name)||n)}</b><code>${v}</code>${esc((notes[k]&&notes[k].use)||'')}</span></div>`).join('')}</div>
    <div class="ratio" aria-label="How much of each color a typical page uses">${Object.entries(mix).map(([k,v]) => `<div style="flex:${v};background:var(--${k})"></div>`).join('')}</div>
    <div class="legend">${Object.entries(mix).map(([k,v]) => `<span>${k} ${v}</span>`).join('')}</div>`;
}
function typeSection(d){
  const f = d.fonts, g = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ abcdefghijklmnopqrstuvwxyz 0123456789';
  const face = (role, x, css, sample, note) => `<div class="face"><div class="role"><b>${role}</b><span class="lbl">${esc(x.source || 'Google Fonts')}</span></div><div class="aa" style="${css}">Aa</div><div class="fam" style="${css}">${esc(x.family)}</div><div class="gl" style="${css};color:var(--ink)">${sample}</div><div class="gl">${esc(note || x.note || '')}</div></div>`;
  const s = B.samples || {};
  return `<div class="faces">
    ${face('Header', f.header, 'font-family:var(--f-head);font-weight:var(--head-w);font-variation-settings:var(--head-var)', g)}
    ${face('Body', f.body, 'font-family:var(--f-body)', esc(s.body || B.hero.sub))}
    ${face('Mono', f.mono, 'font-family:var(--f-mono);font-size:14px', esc(s.mono || 'status · 0O 1lI {} [] => != ->'))}
  </div>
  <div class="scale">
    <div class="row"><span>DISPLAY · 72</span><h4 style="font-size:clamp(34px,5.4vw,72px);line-height:1">${esc(B.hero.title)}</h4></div>
    <div class="row"><span>H1 · 44</span><h4 style="font-size:clamp(28px,3.4vw,44px)">${esc(B.brandLine)}</h4></div>
    <div class="row"><span>H2 · 28</span><h4 style="font-size:28px">${esc(s.h2 || 'How it works')}</h4></div>
    <div class="row"><span>BODY · 18</span><span style="font-size:18px">${esc(s.body || B.hero.sub)}</span></div>
    <div class="row"><span>MONO · 13</span><span style="font-family:var(--f-mono);font-size:13px">${esc(s.mono || 'status · all good')}</span></div>
    ${f.readout ? `<div class="row"><span>READOUT</span><span class="readout" style="font-size:30px;color:var(--primary-text)">${esc((B.readouts||['03 OK'])[0])}</span></div>` : ''}
  </div>`;
}

function render(id){
  const d = dirs.find(x => x.id === id) || dirs[0];
  root.setAttribute('data-d', d.id);
  const hero = B.hero, v = B.voice;
  const multi = dirs.length > 1;
  document.getElementById('app').innerHTML = `
  <div class="bar">${lock()}<span class="lbl">${esc(B.boardLabel || 'Brand identity')}</span></div>
  <div class="intro">
    <div style="display:flex;flex-direction:column;gap:16px"><span class="lbl">${esc(B.company || '')}</span><h1>${esc(B.brandLine)}</h1></div>
    <div class="sum">${(B.summary||[]).map(x => `<p>${esc(x)}</p>`).join('')}</div>
  </div>
  ${multi ? `<div class="part"><span class="lbl">Directions</span><div class="body"><h2>${dirs.length} ways ${esc(B.name)} could look.</h2><p>Pick one, or take pieces from each. Everything below follows the selected direction.</p>
    <div class="picker">${dirs.map(x => `<button class="pick" type="button" data-pick="${x.id}" aria-pressed="${x.id===d.id}"><span class="lbl">${esc(x.name)}</span>${x.recommended?'<span class="rec">Recommended</span>':''}<span class="aa" style="font-family:${fam(x.fonts.header).replace(/"/g,"'")};font-weight:${x.fonts.header.weight||700}">Aa</span><span class="one">${esc(x.one)}</span><span class="fonts"><span>Header · ${esc(x.fonts.header.family)}</span><span>Body · ${esc(x.fonts.body.family)}</span><span>Mono · ${esc(x.fonts.mono.family)}</span></span></button>`).join('')}</div></div></div>` : ''}
  ${B.story ? `<div class="part"><span class="lbl">Story</span><div class="body"><h2>${esc(B.story.headline)}</h2>${(B.story.body||[]).map(p => `<p>${esc(p)}</p>`).join('')}</div></div>` : ''}
  <div class="part"><span class="lbl">Mark</span><div class="body">
    <h2>${esc(B.markTitle || 'The mark')}</h2>${B.markNote ? `<p>${esc(B.markNote)}</p>` : ''}
    <div class="tiles2"><div class="mtile light">${mk()}</div><div class="mtile deep">${mk()}</div></div>
    <div class="tiles2">
      <div class="lt"><div class="show">${lock('big')}${lock('small')}</div><div class="deeprow">${lock()}</div><div class="cap"><b>Lockup</b>${esc(B.wordmark.note || '')}</div></div>
      <div class="lt"><ul class="rules">${(B.logoRules||[]).map(x => `<li>${esc(x)}</li>`).join('')}</ul><div class="cap"><b>Rules</b>Motifs may use color; the logo stays ink or paper.</div></div>
    </div></div></div>
  <div class="part"><span class="lbl">Color</span><div class="body"><h2>${esc(d.colorTitle || 'Color')}</h2>${colorsSection(d)}</div></div>
  <div class="part"><span class="lbl">Type</span><div class="body"><h2>${esc(d.typeTitle || 'Type')}</h2>${typeSection(d)}</div></div>
  <div class="part"><span class="lbl">Motifs</span><div class="body"><h2>Drawn from the mark, used lightly.</h2><p>Each motif has a meaning and a place. On real pages they stay in the background; text leads.</p>
    <div class="mgrid">${motifs().map(m => `<div class="mt"><div class="art">${m.svg}</div><div class="cap"><div><b>${esc(m.name)}</b>${esc(m.means)}</div><div><b>Where it goes</b>${esc(m.where)}</div></div></div>`).join('')}</div></div></div>
  <div class="part"><span class="lbl">In use</span><div class="body"><h2>On a real page.</h2>
    <div class="hero"><div class="bgmark">${dotMark(Math.max(vw,vh)/15, Math.max(vw,vh)/55)}</div>
      <nav>${lock()}<span class="links">${(hero.nav||['How it works','Pricing']).map(x => `<span>${esc(x)}</span>`).join('')}</span></nav>
      <div class="hb"><span class="lbl">${esc(hero.eyebrow || '')}</span><h3>${esc(hero.title)} ${hero.titleSoft ? `<span>${esc(hero.titleSoft)}</span>` : ''}</h3><p class="sub">${esc(hero.sub)}</p>
        <form id="wl"><label for="wl-email" class="lbl" style="position:absolute;left:-9999px">Email</label><input id="wl-email" type="email" placeholder="${esc(hero.placeholder || 'you@example.com')}" required><button class="btn" type="submit">${esc(hero.cta || 'Get early access')}</button></form>
        <span class="okay" id="wl-ok" hidden>${esc(hero.done || "You're on the list (preview only, nothing was sent)")}</span></div></div>
    <div class="apps2">
      ${v ? `<div class="term" role="img" aria-label="${esc(v.title)}"><div class="th"><span>${esc(v.title)}</span><span>${esc(B.name)}</span></div>${v.rows.map(x => `<div class="row"><span class="${x.tone||'muted'}">${esc((x.tag||'').padEnd(6,' '))}</span>${esc(x.text)}</div>`).join('')}</div>` : ''}
      <div class="og" role="img" aria-label="Social share card">${lock()}<div class="om">${dotMark(Math.max(vw,vh)/18, Math.max(vw,vh)/50)}</div><div style="display:flex;flex-direction:column;gap:10px"><h4>${esc(B.brandLine)}</h4><span class="t">Share card · 1200 × 630</span></div></div>
    </div>
    <div class="comps"><button class="btn" type="button">${esc(hero.cta || 'Get early access')}</button>${T ? `<button class="btn" type="button" aria-label="Loading">${mk('spin')}${esc(B.loadingLabel || 'Loading')}</button>` : ''}<button class="btn ghost" type="button">${esc((hero.nav||['How it works'])[0])}</button><span class="vdiv"></span>${(B.chips||[{label:'stopped',tone:'primary'},{label:'ok',tone:'accent'},{label:'waiting',tone:'muted'}]).map(c => `<span class="chip ${c.tone}">${esc(c.label)}</span>`).join('')}</div>
    <div class="band">${svg(1540,120, Array.from({length:14},(_,i)=>`<g opacity="${i===6?1:.22}">${placed(60+i*110,60,76,(i%2)*90, i===6?'color:var(--primary)':'')}</g>`).join(''), 'preserveAspectRatio="xMidYMid slice"')}</div>
  </div></div>
  <footer>${lock()}<span class="lbl">${esc(B.footer || B.company || '')}</span></footer>`;
  dotify(document.getElementById('app'));
  document.querySelectorAll('[data-pick]').forEach(b => b.addEventListener('click', () => { render(b.dataset.pick); try{localStorage.setItem('brand-dir', b.dataset.pick);}catch(_){} }));
  const wl = document.getElementById('wl'); if (wl) wl.addEventListener('submit', e => { e.preventDefault(); document.getElementById('wl-ok').hidden = false; });
}
let start = null; try{ start = localStorage.getItem('brand-dir'); }catch(_){}
render(dirs.some(x => x.id === start) ? start : (dirs.find(x => x.recommended) || dirs[0]).id);
})();
</script>
